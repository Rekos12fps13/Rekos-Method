<!doctype html><html><head><meta charset="utf-8"><title>Rekos FFmpeg Engine</title></head><body>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/umd/ffmpeg.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.2/dist/umd/index.js"></script>
<script>
let ffmpeg=null, loaded=false;
const CORE='https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd';
const $ff=()=>window.FFmpeg;
async function load(){
  if(loaded)return;
  ffmpeg=new FFmpeg.FFmpeg();
  ffmpeg.on('progress',({progress})=>window.parent.postMessage({type:'progress',progress:Math.round(progress*92)+4,status:'Encoding',log:'Encoding 2160p / 120fps target…'},'*'));
  ffmpeg.on('log',({message})=>window.parent.postMessage({type:'progress',progress:4,status:'Encoding',log:message.slice(-160)},'*'));
  await ffmpeg.load({coreURL:await toBlobURL(CORE+'/ffmpeg-core.js','text/javascript'),wasmURL:await toBlobURL(CORE+'/ffmpeg-core.wasm','application/wasm')});
  loaded=true;
}
function toBlobURL(url,type){return fetch(url).then(r=>r.blob()).then(b=>URL.createObjectURL(new Blob([b],{type})))}
function ext(name){const m=name.match(/\.([^.]+)$/);return m?m[1].toLowerCase():'mp4'}
function calcBitrate(maxBytes,duration,audioKbps=128){
  const totalKbps=(maxBytes*8)/(duration*1000)*0.94;
  return Math.max(1200,Math.floor(totalKbps-audioKbps));
}
async function durationOf(buf,name){
  const blob=new Blob([buf]);const url=URL.createObjectURL(blob);return await new Promise((resolve,reject)=>{const v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>{URL.revokeObjectURL(url);resolve(v.duration||1)};v.onerror=()=>{URL.revokeObjectURL(url);resolve(30)};v.src=url})}
async function transcode(d){
 try{
  await load();
  const inExt=ext(d.name);const input='input.'+inExt;const out='output.mp4';
  await ffmpeg.writeFile(input,new Uint8Array(d.buffer));
  const duration=await durationOf(d.buffer,d.name);const maxBytes=d.maxMb*1024*1024;
  let videoKbps=calcBitrate(maxBytes,duration,128);
  if(d.quality==='quality')videoKbps=Math.min(videoKbps,22000);
  if(d.quality==='size')videoKbps=Math.max(1200,Math.floor(videoKbps*0.78));
  const args=['-i',input,'-map','0:v:0','-map','0:a:0?','-vf','scale=3840:2160:force_original_aspect_ratio=decrease,pad=3840:2160:(ow-iw)/2:(oh-ih)/2:color=black','-r','120','-c:v','libx264','-preset','veryfast','-profile:v','high','-pix_fmt','yuv420p','-b:v',videoKbps+'k','-maxrate',videoKbps+'k','-bufsize',(videoKbps*2)+'k','-c:a','aac','-b:a','128k','-movflags','+faststart','-y',out];
  window.parent.postMessage({type:'progress',progress:4,status:'Encoding',log:`Target bitrate ${videoKbps} kbps; source duration ${duration.toFixed(1)}s`},'*');
  await ffmpeg.exec(args);
  let data=await ffmpeg.readFile(out);
  // If the first pass is still above the limit, retry at a lower bitrate.
  if(data.length>maxBytes){
    const retry=Math.max(900,Math.floor(videoKbps*maxBytes/data.length*0.90));
    await ffmpeg.deleteFile(out).catch(()=>{});
    window.parent.postMessage({type:'progress',progress:94,status:'Size correction',log:`Output exceeded limit; retrying at ${retry} kbps…`},'*');
    await ffmpeg.exec(['-i',input,'-map','0:v:0','-map','0:a:0?','-vf','scale=3840:2160:force_original_aspect_ratio=decrease,pad=3840:2160:(ow-iw)/2:(oh-ih)/2:color=black','-r','120','-c:v','libx264','-preset','veryfast','-profile:v','high','-pix_fmt','yuv420p','-b:v',retry+'k','-maxrate',retry+'k','-bufsize',(retry*2)+'k','-c:a','aac','-b:a','96k','-movflags','+faststart','-y',out]);
    data=await ffmpeg.readFile(out);
  }
  const safe=(d.name.replace(/\.[^.]+$/,'')||'video')+'-rekos-2160p-120fps.mp4';
  window.parent.postMessage({type:'done',buffer:data.buffer,name:safe,maxBytes},'*');
 }catch(err){window.parent.postMessage({type:'error',message:String(err&&err.message||err)},'*')}
}
window.addEventListener('message',e=>{if(e.data&&e.data.type==='transcode')transcode(e.data)});
window.parent.postMessage({type:'ready'},'*');
</script></body></html>
